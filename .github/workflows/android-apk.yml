# يبني ملف APK للأندرويد على سيرفرات GitHub (بدون Android Studio). التشغيل: تبويب Actions ← Build Android APK ← Run workflow.
name: Build Android APK
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web app
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}      # رابط الخادم على Render (Settings ← Variables ← Actions)
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}  # رابط الموقع الذي يُشارَك مع الأصدقاء (نفس الرابط غالباً)
        run: npm run build
      - name: Add Android project + icons
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android
      - name: Allow microphone in the APK
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' $M
          grep -n "uses-permission" $M
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nabd-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
